name: CI/CD - Redaction Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_comprehend:
        description: "Enable Amazon Comprehend PII detection (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  STACK_NAME: doc-redaction

jobs:
  test:
    name: Lint, test & security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Flake8 lint
        run: flake8 backend scripts

      - name: PyTest unit tests
        run: pytest backend -q

      - name: Validate CloudFormation template
        run: cfn-lint infra/template.yaml

      - name: Dependency vulnerability scan (Python)
        run: pip-audit -r backend/processor/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Dependency vulnerability scan (npm)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to AWS
    needs: test
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/processor/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Learner Lab credentials are temporary (~4 h). Refresh AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN in repo secrets before deploying.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        id: aws-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Authenticated to AWS account $ACCOUNT_ID in $AWS_REGION"

      - name: Package & deploy Lambdas and CloudFormation stack
        run: |
          USE_COMPREHEND="${{ github.event.inputs.use_comprehend || vars.USE_COMPREHEND || 'false' }}"
          python scripts/deploy.py \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --use-comprehend "$USE_COMPREHEND" \
            --skip-frontend

      - name: Build frontend & generate config.json
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          python - <<'PY'
          import json, os, subprocess
          stack = os.environ["STACK_NAME"]
          region = os.environ["AWS_REGION"]
          raw = subprocess.check_output(
              ["aws", "cloudformation", "describe-stacks", "--stack-name", stack, "--region", region, "--output", "json"],
              text=True,
          )
          outs = {o["OutputKey"]: o["OutputValue"] for o in json.loads(raw)["Stacks"][0]["Outputs"]}
          cfg = {
              "region": outs["Region"],
              "apiUrl": outs["ApiUrl"],
              "userPoolId": outs["UserPoolId"],
              "userPoolClientId": outs["UserPoolClientId"],
          }
          with open("frontend/dist/config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          print("Generated frontend/dist/config.json:", json.dumps(cfg))
          PY

      - name: Sync frontend to S3 static website & ensure CORS
        id: frontend-deploy
        run: |
          ACCOUNT_ID="${{ steps.aws-id.outputs.account_id }}"
          FRONTEND_BUCKET="${{ vars.FRONTEND_BUCKET }}"
          if [ -z "$FRONTEND_BUCKET" ]; then
            FRONTEND_BUCKET="redactiq-frontend-${ACCOUNT_ID}"
          fi
          if ! aws s3api head-bucket --bucket "$FRONTEND_BUCKET" --region "$AWS_REGION" 2>/dev/null; then
            aws s3 mb "s3://$FRONTEND_BUCKET" --region "$AWS_REGION"
            aws s3 website "s3://$FRONTEND_BUCKET" --index-document index.html --error-document index.html
          fi
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --delete --region "$AWS_REGION"

          WEBSITE_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue" --output text)
          if [ -z "$WEBSITE_URL" ] || [ "$WEBSITE_URL" = "None" ]; then
            WEBSITE_URL="http://${FRONTEND_BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"
          fi
          WEBSITE_URL="${WEBSITE_URL%/}"

          RAW_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='RawBucketName'].OutputValue" --output text)
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          API_ID=$(echo "$API_URL" | sed -E 's|https://([^.]+)\..*|\1|')

          aws s3api put-bucket-cors --bucket "$RAW_BUCKET" --region "$AWS_REGION" --cors-configuration "{
            \"CORSRules\": [{
              \"AllowedHeaders\": [\"*\"],
              \"AllowedMethods\": [\"POST\"],
              \"AllowedOrigins\": [\"http://localhost:5173\", \"$WEBSITE_URL\"],
              \"MaxAgeSeconds\": 3000
            }]
          }"

          aws apigatewayv2 update-api --api-id "$API_ID" --region "$AWS_REGION" --cors-configuration "{
            \"AllowHeaders\": [\"authorization\", \"content-type\"],
            \"AllowMethods\": [\"GET\", \"POST\", \"DELETE\", \"OPTIONS\"],
            \"AllowOrigins\": [\"http://localhost:5173\", \"$WEBSITE_URL\"],
            \"MaxAge\": 600
          }" >/dev/null

          echo "website_url=$WEBSITE_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test live site & API
        run: |
          URL="${{ steps.frontend-deploy.outputs.website_url }}"
          API_URL="${{ steps.frontend-deploy.outputs.api_url }}"
          echo "Checking $URL"
          ok=false
          for i in $(seq 1 12); do
            html_code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/") || true
            cfg_code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/config.json") || true
            if [ "$html_code" = "200" ] && [ "$cfg_code" = "200" ]; then
              ok=true
              break
            fi
            sleep 10
          done
          [ "$ok" = "true" ] || { echo "Frontend smoke test failed (index=$html_code, config=$cfg_code)"; exit 1; }
          curl -sf "$URL/config.json" | python -c "import json, sys; d = json.load(sys.stdin); assert all(k in d and d[k] for k in ('region', 'apiUrl', 'userPoolId', 'userPoolClientId')); print('config.json verified:', d)"
          api_code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/documents")
          echo "API Gateway unauthenticated check HTTP status: $api_code"
          [ "$api_code" = "401" ] || { echo "Expected 401 from JWT-protected API, got $api_code"; exit 1; }
          echo "Live deployment verified: $URL"
