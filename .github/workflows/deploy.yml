name: CI/CD - Redaction Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: doc-redaction

jobs:
  test:
    name: Lint, test & security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: pip install -r backend/requirements-dev.txt

      - name: Flake8 lint
        run: flake8 backend scripts

      - name: PyTest unit tests
        run: pytest backend -q

      - name: Validate CloudFormation template
        run: cfn-lint infra/template.yaml

      - name: Dependency vulnerability scan (Python)
        run: pip-audit -r backend/processor/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, test (Vitest/Jest-compatible) and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Dependency vulnerability scan (npm)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to AWS
    needs: test
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Learner Lab credentials are temporary (about 4 h). Before each run, copy the
      # three values from Learner Lab > AWS Details > AWS CLI into repo secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package & deploy Lambdas + API Gateway, build React, sync S3, invalidate CloudFront
        run: python scripts/deploy.py --stack "$STACK_NAME" --region "$AWS_REGION"

      - name: Smoke test live site
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue" --output text)
          echo "Checking $URL"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/config.json") && [ "$code" = "200" ] && break
            sleep 15
          done
          curl -sf "$URL/config.json"
          echo "Live deployment verified: $URL"

