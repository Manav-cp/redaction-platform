name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-ci:
    name: Backend Lint, Test, Audit & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Lambda runtime parity)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Code quality linting (Flake8)
        run: flake8 backend scripts

      - name: Run unit & authorization tests (Pytest)
        run: pytest backend -v

      - name: Validate CloudFormation template (cfn-lint)
        run: cfn-lint infra/template.yaml

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r backend/processor/requirements.txt

      - name: Secret pattern scan
        run: |
          echo "Scanning codebase for accidental secrets or credentials..."
          ! git grep -I -E "AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|aws_secret_access_key\s*=|ghp_[0-9a-zA-Z]{36}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----" -- . ':(exclude).github/workflows/ci.yml'

  frontend-ci:
    name: Frontend Test, Build & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build production React application
        run: npm run build

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --omit=dev --audit-level=high

  package-artifacts:
    name: Package Deployment Artifacts
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Distribution
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Lambda Packages
        run: |
          mkdir -p .build/api .build/processor .build/dist_artifacts
          
          # Package API Lambda
          cp backend/api/handler.py .build/api/
          (cd .build/api && zip -q -r ../dist_artifacts/api.zip .)

          # Package Processor Lambda with dependencies
          cp -r backend/processor/*.py .build/processor/
          pip install -r backend/processor/requirements.txt -t .build/processor/ --quiet
          # Remove cache directories to keep package lean
          find .build/processor -type d -name "__pycache__" -exec rm -rf {} +
          find .build/processor -type d -name "*.dist-info" -exec rm -rf {} +
          (cd .build/processor && zip -q -r ../dist_artifacts/processor.zip .)

          ls -lh .build/dist_artifacts/

      - name: Upload Backend Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: .build/dist_artifacts/
          retention-days: 14

      - name: Upload Frontend Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: frontend/dist/
          retention-days: 14
